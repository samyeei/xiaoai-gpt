<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Codex 语音会话</title>
<style nonce="__NONCE__">body{max-width:900px;margin:32px auto;padding:0 20px;font:16px system-ui;color:#182b3a;background:#f4f7fa}section{background:white;padding:20px;margin:18px 0;border-radius:12px}input,textarea,button{font:inherit;padding:10px;margin:5px 0;box-sizing:border-box}input,textarea{width:100%}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#536779}</style>
<h1>Codex 独立语音会话</h1><p>在这里查看回复、处理确认或补充输入。每次批准只作用于屏幕上显示的请求。</p>
<section id="login"><label>本机控制密钥<input id="key" type="password" autocomplete="off"></label><button id="connect">连接</button><small>密钥保存在 Mac 的 private/config.json。它与群晖桥接密钥不同，不会保存到浏览器。</small></section>
<p id="status" role="status">尚未连接</p><div id="pending"></div><section><h2>任务与最终回复</h2><div id="jobs"></div></section>
<section id="unified" hidden><h2>Mac 统一服务 · Muse</h2><pre id="unified-status"></pre><label>Muse SDK token<input id="sdk-token" type="password" autocomplete="off"></label><button id="save-sdk">保存 token</button><button id="pair-start">开始手机配对</button><button id="pair-stop">停止配对</button><textarea id="muse-text" placeholder="独立 Muse 文本测试"></textarea><button id="muse-ask">发送 Muse</button><pre id="muse-reply"></pre></section>
<script nonce="__NONCE__">
const unifiedEnabled='__UNIFIED__'==='true';let museJob=null;
let token='',busy=false;const cards=new Map();const cardKey=p=>JSON.stringify([p.id,p.method,p.params.threadId,p.params.turnId]);
const $=id=>document.getElementById(id);
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error||'请求失败');return data;}
function text(tag,value,parent){const e=document.createElement(tag);e.textContent=value;parent.append(e);return e;}
function button(title,action,parent){const b=text('button',title,parent);b.onclick=async()=>{b.disabled=true;try{await action();await refresh();}catch(e){$('status').textContent=e.message;}finally{b.disabled=false;}};}
async function refresh(){if(!token||busy)return;busy=true;try{const state=await api('/control/status');$('status').textContent=state.ready?'Codex 服务就绪':'Codex 暂不可用，请检查 Mac 服务';const requests=await api('/control/pending');const live=new Set(requests.map(cardKey));for(const [id,card] of cards)if(!live.has(id)){card.remove();cards.delete(id);}for(const p of requests){const id=cardKey(p);if(cards.has(id))continue;const s=document.createElement('section');cards.set(id,s);$('pending').append(s);text('h2','需要你处理',s);text('pre',JSON.stringify({method:p.method,details:p.params,item:p.item},null,2),s);const respond=result=>api('/control/respond',{id:p.id,result});if(['item/commandExecution/requestApproval','item/fileChange/requestApproval'].includes(p.method)){for(const [label,decision] of [['本次批准','accept'],['拒绝','decline'],['取消','cancel']]){if(!p.params.availableDecisions||p.params.availableDecisions.includes(decision))button(label,()=>respond({decision}),s);}}else if(p.method==='item/tool/requestUserInput'){const fields=[];for(const q of p.params.questions||[]){text('p',q.question,s);if(q.options)text('pre',q.options.map(x=>x.label+': '+x.description).join('\n'),s);const input=document.createElement('textarea');input.rows=3;s.append(input);fields.push([q.id,input]);}button('提交回答',()=>respond({answers:Object.fromEntries(fields.map(([id,e])=>[id,{answers:[e.value]}]))}),s);}else if(p.method==='item/permissions/requestApproval'){text('p','批准屏幕上列出的权限，仅限本轮任务。',s);button('本轮批准所列权限',()=>respond({permissions:p.params.permissions,scope:'turn'}),s);button('拒绝扩展权限',()=>respond({permissions:{},scope:'turn'}),s);}else{button('拒绝',()=>respond({action:'decline',content:null}),s);} }
if(unifiedEnabled){try{$('unified').hidden=false;$('unified-status').textContent=JSON.stringify(await api('/control/unified/status'),null,2);if(museJob){const job=await api('/control/unified/muse/get',{id:museJob});$('muse-reply').textContent=job.reply||job.error||job.status;}}catch(e){$('unified-status').textContent='统一服务暂不可用';}}
const jobs=await api('/control/jobs');$('jobs').replaceChildren();for(const j of jobs){const s=document.createElement('section');$('jobs').append(s);text('p',j.request_id+' · '+j.status,s);if(j.reply)text('pre',j.reply,s);if(j.error)text('p',j.error,s);if(['queued','running','waiting_user'].includes(j.status))button('取消任务',()=>api('/control/cancel',{id:j.request_id}),s);}}catch(e){$('status').textContent=e.message;}finally{busy=false;}}
if(unifiedEnabled){for(const [id,route] of [['pair-start','/pair/start'],['pair-stop','/pair/stop']])$(id).onclick=()=>api('/control/unified'+route,{}).then(refresh).catch(e=>$('status').textContent=e.message);$('save-sdk').onclick=async()=>{const value=$('sdk-token').value;$('sdk-token').value='';try{await api('/control/unified/token',{token:value});await refresh();}catch(e){$('status').textContent=e.message;}};$('muse-ask').onclick=async()=>{try{const j=await api('/control/unified/muse/ask',{text:$('muse-text').value});museJob=j.request_id;await refresh();}catch(e){$('muse-reply').textContent=e.message;}};}
$('connect').onclick=()=>{token=$('key').value;$('key').value='';void refresh();};setInterval(refresh,2000);
</script></html>
