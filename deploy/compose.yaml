services:
  xiaoai-muse:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: local/xiaoai-muse:hey-muse-2026-10-06
    restart: unless-stopped
    environment:
      HEY_MUSE: "1"
    ports:
      - "4399:4399"
      - "4398:4398"
    volumes:
      - ./config/bridge.json:/app/config/bridge.json:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  voice:
    build:
      context: ..
      dockerfile: deploy/voice/Dockerfile
    image: local/xiaoai-muse-voice:2026-10-06
    restart: unless-stopped
    volumes:
      - ./models:/models:ro
    environment:
      VAD_RMS: "60"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
