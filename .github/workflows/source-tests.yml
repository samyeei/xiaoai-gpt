name: Source tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use bundled ws without install scripts
        run: |
          mkdir -p deploy/bridge/node_modules
          ln -s ../vendor/ws deploy/bridge/node_modules/ws
      - name: Node regressions
        run: node --test deploy/bridge/*.test.mjs mac/codex-service/*.test.mjs mac/unified-service/*.test.mjs mac/realtime-voice/*.test.mjs
